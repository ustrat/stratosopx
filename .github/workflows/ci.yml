name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-documents:
    name: No business documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if PDFs, Office files, images or business.txt are tracked
        run: |
          found=$(git ls-files | grep -i -E '\.(pdf|docx?|xlsx?|pptx?|png|jpe?g)$|(^|/)business\.txt$' | grep -v '^public/' || true)
          if [ -n "$found" ]; then
            echo "::error::Business documents must not be committed:"
            echo "$found"
            exit 1
          fi
          echo "No documents tracked."

  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            apps/web/out
            apps/product/dist
          retention-days: 7
